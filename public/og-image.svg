<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>
  
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3f4f6" />
    </linearGradient>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a085" />
      <stop offset="100%" stop-color="#0066cc" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#00a085" />
    </linearGradient>
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066cc" />
      <stop offset="100%" stop-color="#5a4fcf" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative Elements -->
  <circle cx="100" cy="100" r="60" fill="#0066cc" opacity="0.05"/>
  <circle cx="1100" cy="530" r="80" fill="#00a085" opacity="0.05"/>
  <circle cx="1000" cy="150" r="40" fill="#5a4fcf" opacity="0.1"/>
  
  <!-- Main Content Container -->
  <g transform="translate(100, 150)">
    <!-- Logo Section -->
    <g transform="translate(0, 0)">
      <!-- Large Watch Icon -->
      <g transform="scale(3)">
        <!-- Watch Band -->
        <path
          d="M8 12C8 10.8954 8.89543 10 10 10H14V6C14 4.89543 14.8954 4 16 4H24C25.1046 4 26 4.89543 26 6V10H30C31.1046 10 32 10.8954 32 12V28C32 29.1046 31.1046 30 30 30H26V34C26 35.1046 25.1046 36 24 36H16C14.8954 36 14 35.1046 14 34V30H10C8.89543 30 8 29.1046 8 28V12Z"
          fill="url(#logoGradient)"
          filter="drop-shadow(0 4px 8px rgba(0,0,0,0.1))"
        />
        
        <!-- Watch Screen -->
        <rect
          x="12"
          y="12"
          width="16"
          height="16"
          rx="2"
          fill="#ffffff"
          stroke="rgba(0,0,0,0.1)"
          stroke-width="0.5"
        />
        
        <!-- Health Cross -->
        <g transform="translate(20, 20)">
          <rect x="-1" y="-4" width="2" height="8" rx="1" fill="url(#crossGradient)" />
          <rect x="-4" y="-1" width="8" height="2" rx="1" fill="url(#crossGradient)" />
        </g>
        
        <!-- Data Connection Dots -->
        <circle cx="14" cy="8" r="1" fill="#5a4fcf" opacity="0.8" />
        <circle cx="26" cy="8" r="1" fill="#0066cc" opacity="0.8" />
        <circle cx="14" cy="32" r="1" fill="#00a085" opacity="0.8" />
        <circle cx="26" cy="32" r="1" fill="#5a4fcf" opacity="0.8" />
      </g>
    </g>
    
    <!-- Text Content -->
    <g transform="translate(150, 20)">
      <!-- Main Title -->
      <text x="0" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="bold" fill="url(#textGradient)">
        HealthBridge
      </text>
      
      <!-- Tagline -->
      <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500" fill="#6b7280">
        Connect. Track. Care.
      </text>
      
      <!-- Description -->
      <text x="0" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#374151">
        Your Complete Health Data Platform
      </text>
      
      <!-- Features -->
      <text x="0" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6b7280">
        Connect all your health devices and data in one place.
      </text>
      <text x="0" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#6b7280">
        For patients and healthcare providers.
      </text>
      
      <!-- Device Icons -->
      <g transform="translate(0, 220)">
        <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#9ca3af">
          INTEGRATES WITH:
        </text>
        
        <!-- Device Badges -->
        <g transform="translate(0, 25)">
          <rect x="0" y="0" width="100" height="30" rx="15" fill="#f3f4f6" stroke="#e5e7eb"/>
          <text x="50" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Apple Watch</text>
          
          <rect x="110" y="0" width="70" height="30" rx="15" fill="#f3f4f6" stroke="#e5e7eb"/>
          <text x="145" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Fitbit</text>
          
          <rect x="190" y="0" width="70" height="30" rx="15" fill="#f3f4f6" stroke="#e5e7eb"/>
          <text x="225" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Garmin</text>
          
          <rect x="270" y="0" width="60" height="30" rx="15" fill="#f3f4f6" stroke="#e5e7eb"/>
          <text x="300" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#374151">Oura</text>
          
          <rect x="340" y="0" width="70" height="30" rx="15" fill="#f3f4f6" stroke="#e5e7eb"/>
          <text x="375" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="12" text-anchor="middle" fill="#374151">WHOOP</text>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Bottom Brand -->
  <g transform="translate(50, 570)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#9ca3af">
      UCF Capstone Project • HIPAA Compliant • Trusted by 10,000+ patients
    </text>
  </g>
</svg>

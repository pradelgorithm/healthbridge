<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="1200" height="630" fill="#f8fafc"/>
  
  <!-- Main content area -->
  <rect x="100" y="100" width="1000" height="430" fill="#ffffff" rx="20" stroke="#e2e8f0" stroke-width="2"/>
  
  <!-- Logo area with proper HealthBridge logo -->
  <g transform="translate(200, 200)">
    <!-- Proper HealthBridge logo scaled up -->
    <g transform="scale(3)">
      <!-- Watch Band -->
      <path
        d="M8 12C8 10.8954 8.89543 10 10 10H14V6C14 4.89543 14.8954 4 16 4H24C25.1046 4 26 4.89543 26 6V10H30C31.1046 10 32 10.8954 32 12V28C32 29.1046 31.1046 30 30 30H26V34C26 35.1046 25.1046 36 24 36H16C14.8954 36 14 35.1046 14 34V30H10C8.89543 30 8 29.1046 8 28V12Z"
        fill="#00a085"
      />
      
      <!-- Watch Screen -->
      <rect
        x="12"
        y="12"
        width="16"
        height="16"
        rx="2"
        fill="#ffffff"
        stroke="#e5e7eb"
        stroke-width="0.5"
      />
      
      <!-- Health Cross Icon -->
      <g transform="translate(20, 20)">
        <!-- Vertical bar -->
        <rect x="-1" y="-4" width="2" height="8" rx="1" fill="#0066cc" />
        <!-- Horizontal bar -->
        <rect x="-4" y="-1" width="8" height="2" rx="1" fill="#0066cc" />
      </g>
      
      <!-- Data Connection Indicators -->
      <circle cx="14" cy="8" r="1" fill="#5a4fcf" opacity="0.8" />
      <circle cx="18" cy="7" r="0.8" fill="#0066cc" opacity="0.6" />
      <circle cx="22" cy="7" r="0.8" fill="#00a085" opacity="0.4" />
      <circle cx="26" cy="8" r="1" fill="#5a4fcf" opacity="0.8" />
      
      <circle cx="14" cy="32" r="1" fill="#00a085" opacity="0.8" />
      <circle cx="18" cy="33" r="0.8" fill="#5a4fcf" opacity="0.6" />
      <circle cx="22" cy="33" r="0.8" fill="#0066cc" opacity="0.4" />
      <circle cx="26" cy="32" r="1" fill="#00a085" opacity="0.8" />
    </g>
  </g>
  
  <!-- Text content -->
  <g transform="translate(300, 230)">
    <!-- Main title -->
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="64" font-weight="bold" fill="#0066cc">HealthBridge</text>
    
    <!-- Subtitle -->
    <text x="0" y="50" font-family="Arial, sans-serif" font-size="28" fill="#374151">Your Complete Health Data Platform</text>
    
    <!-- Description -->
    <text x="0" y="90" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">Connect all your health devices and data in one place.</text>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="20" fill="#6b7280">For patients and healthcare providers.</text>
    
    <!-- Features -->
    <g transform="translate(0, 160)">
      <rect x="0" y="0" width="140" height="30" rx="15" fill="#e0f2fe" stroke="#0066cc"/>
      <text x="70" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#0066cc" font-weight="600">HIPAA Compliant</text>
      
      <rect x="150" y="0" width="120" height="30" rx="15" fill="#ecfdf5" stroke="#00a085"/>
      <text x="210" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#00a085" font-weight="600">Real-time Sync</text>
      
      <rect x="280" y="0" width="130" height="30" rx="15" fill="#faf5ff" stroke="#5a4fcf"/>
      <text x="345" y="20" font-family="Arial, sans-serif" font-size="14" text-anchor="middle" fill="#5a4fcf" font-weight="600">Family Profiles</text>
    </g>
  </g>
  
  <!-- Bottom text -->
  <text x="600" y="580" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#9ca3af">
    UCF Capstone Project • Trusted by 10,000+ patients and 500+ providers
  </text>
</svg>
